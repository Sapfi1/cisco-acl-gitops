name: GitOps Deployment to Kubernetes

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application & Monitoring
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/cisco-acl-chart

      - name: Deploy Cisco ACL Web via Helm
        run: |
          eval $(minikube docker-env)
          docker build -t cisco-acl-gitops-web:v1 -f app/Dockerfile app/
          helm upgrade --install cisco-acl ./helm/cisco-acl-chart \
            --set service.type=NodePort

      - name: Deploy Monitoring (Prometheus & Grafana)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts || true
          helm repo update
          helm upgrade --install k8s-monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set alertmanager.enabled=false \
            --set prometheus.prometheusSpec.resources.requests.memory=256Mi \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort=30300 \
            --set grafana.adminPassword=admin

      - name: Configure Ingress Routes
        run: |
          kubectl apply -f - << 'EOF'
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: grafana-ingress
            namespace: monitoring
            annotations:
              ingress.class: nginx
          spec:
            rules:
              - host: grafana.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: k8s-monitoring-grafana
                          port:
                            number: 80
          EOF

      - name: Verify Deployment Status
        run: |
          echo "=== Pods in default namespace ==="
          kubectl get pods -l app=cisco-acl
          echo "=== Pods in monitoring namespace ==="
          kubectl get pods -n monitoring
          echo "=== Ingress routes ==="
          kubectl get ingress -A
          echo "=== NodePort Services ==="
          kubectl get svc -A | grep NodePort
